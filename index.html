<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23161616%22/%3E%3Crect x=%224%22 y=%223%22 width=%223%22 height=%2210%22 fill=%22%23f3f3f1%22/%3E%3Crect x=%229%22 y=%226%22 width=%223%22 height=%227%22 fill=%22%23f3f3f1%22/%3E%3C/svg%3E" />
    <title>Mid Valley – Abdullah Hukum Transit Hub · Site Analysis (demo)</title>
    <meta name="description" content="Illustrative 3D site analysis of the Mid Valley – Abdullah Hukum transit hub, Kuala Lumpur, built from OpenStreetMap data." />
    <!-- Before first paint: theme (saved > ?theme > OS preference), language (?lang > saved > en), loader API. -->
    <script>
      (function () {
        var d = document.documentElement, q = new URLSearchParams(location.search);
        function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        var th = q.get('theme') || get('mv-theme');
        if (th !== 'dark' && th !== 'light') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', th);
        var lg = q.get('lang') || get('mv-lang'); if (['en', 'zh', 'ms'].indexOf(lg) < 0) lg = 'en';
        d.setAttribute('data-lang', lg); d.lang = { en: 'en', zh: 'zh-Hans-MY', ms: 'ms-MY' }[lg];
        d.className += ' mv-loading';
        var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var S = {
          en: { title: 'MID VALLEY – ABDULLAH HUKUM', sub: 'SITE ANALYSIS · LOADING', subErr: 'SITE ANALYSIS', app: 'Application', data: 'Map data (OpenStreetMap)', scene: '3D scene', fonts: 'Fonts', frame: 'First frame', slow: 'This is taking longer than usual.', reload: 'Reload', webglTitle: 'The 3D view can’t start', webgl: 'This page needs WebGL, which is unavailable or turned off in this browser. Try turning on hardware acceleration, using another browser, or reloading.', initTitle: 'Loading failed', init: 'Something went wrong while starting the page. Please reload.' },
          zh: { title: '谷中城 – ABDULLAH HUKUM', sub: '场地分析 · 加载中', subErr: '场地分析', app: '应用程序', data: '地图数据（OpenStreetMap）', scene: '三维场景', fonts: '字体', frame: '首帧', slow: '加载时间比平常更长。', reload: '重新加载', webglTitle: '无法启动三维视图', webgl: '本页面需要 WebGL，但此浏览器中 WebGL 不可用或已关闭。请开启硬件加速、换用其他浏览器，或重新加载。', initTitle: '加载失败', init: '页面启动时出错，请重新加载。' },
          ms: { title: 'MID VALLEY – ABDULLAH HUKUM', sub: 'ANALISIS TAPAK · MEMUATKAN', subErr: 'ANALISIS TAPAK', app: 'Aplikasi', data: 'Data peta (OpenStreetMap)', scene: 'Adegan 3D', fonts: 'Fon', frame: 'Bingkai pertama', slow: 'Ini mengambil masa lebih lama daripada biasa.', reload: 'Muat semula', webglTitle: 'Paparan 3D tidak dapat dimulakan', webgl: 'Halaman ini memerlukan WebGL, yang tidak tersedia atau dimatikan dalam pelayar ini. Cuba hidupkan pecutan perkakasan, gunakan pelayar lain, atau muat semula.', initTitle: 'Gagal dimuatkan', init: 'Berlaku ralat semasa memulakan halaman. Sila muat semula.' }
        }[lg];
        // The loader deliberately stays up for at least MIN_LOADER_MS after navigation start so a load is clearly
        // visible (about 3 s; 1.5 s under prefers-reduced-motion, the same 1:2 ratio as before; ?skipLoader=1 bypasses it for dev / screenshots). It hides at
        // max(app truly ready, minimum). Visual progress is paced across the minimum: it follows elapsed time but
        // never runs ahead of the real steps, and a step only shows as done when it is really done AND the paced
        // bar has reached it. The slow-load note appears only if the app is still not ready after SLOW_MS.
        var MIN_LOADER_MS = 3000, MIN_LOADER_MS_REDUCED = 1500, SLOW_MS = 12000;
        var skip = /^(1|true|yes)$/.test(q.get('skipLoader') || '');
        var MIN = skip ? 0 : rm ? MIN_LOADER_MS_REDUCED : MIN_LOADER_MS;
        var now = function () { return window.performance && performance.now ? performance.now() : Date.now() - L.t0; };
        var STEPS = ['app', 'data', 'scene', 'fonts', 'frame'], N = STEPS.length;
        var real = { app: 'active' }, appReady = false, timer = 0, revealCb = [];
        var L = window.__loader = { strings: S, isReady: false, failed: false, t0: Date.now(), minMs: MIN, revealedAt: null,
          el: function () { return document.getElementById('loader'); },
          step: function (id, state) { if (L.isReady || L.failed) return; real[id] = state; render(); },
          ready: function () { if (L.isReady || L.failed || appReady) return; appReady = true; render(); },
          onReveal: function (cb) { if (L.isReady) cb(); else revealCb.push(cb); },
          error: function (kind, detail) {
            var el = L.el(); if (L.isReady || !el) return; L.failed = true; clearTimeout(timer);
            el.classList.add('is-error');
            el.querySelector('#ld-sub').textContent = S.subErr;
            el.querySelector('#ld-err-title').textContent = kind === 'webgl' ? S.webglTitle : S.initTitle;
            el.querySelector('#ld-err-text').textContent = kind === 'webgl' ? S.webgl : S.init;
            if (detail) el.querySelector('#ld-err-detail').textContent = String(detail).slice(0, 240);
            el.querySelector('#ld-err-reload').focus();
          }
        };
        function reveal() {
          var el = L.el(); L.isReady = true; L.revealedAt = now(); clearTimeout(timer);
          d.classList.remove('mv-loading');
          if (el) {
            el.querySelector('.ld-fill').style.width = '100%';
            [].forEach.call(el.querySelectorAll('.ld-steps li'), function (li) { li.className = 'done'; });
            el.classList.add('is-done');
            setTimeout(function () { el.hidden = true; el.remove(); }, rm || skip ? 0 : 520);
          }
          revealCb.splice(0).forEach(function (cb) { try { cb(); } catch (e) {} });
        }
        function render() {
          clearTimeout(timer); if (L.isReady || L.failed) return;
          var el = L.el(), t = now();
          var realDone = 0; while (realDone < N && real[STEPS[realDone]] === 'done') realDone++;
          if (appReady) realDone = N;
          // paced progress: elapsed share of the minimum, capped just short of the next unfinished real step
          var timeFrac = MIN > 0 ? Math.min(1, t / MIN) : 1;
          var cap = realDone >= N ? 1 : (realDone + 0.85) / N;
          var p = Math.min(timeFrac, cap);
          if (realDone >= N && t >= MIN) { reveal(); return; }
          if (el) {
            var shown = Math.min(realDone, Math.floor(p * N + 1e-6));
            for (var i = 0; i < N; i++) { var li = el.querySelector('[data-step="' + STEPS[i] + '"]'); if (li) li.className = i < shown ? 'done' : i === shown ? 'active' : ''; }
            // reduced motion: no animated bar; it moves in whole steps only
            el.querySelector('.ld-fill').style.width = (rm ? (shown / N) * 100 : p * 100).toFixed(2) + '%';
            if (t >= SLOW_MS && !appReady) el.classList.add('is-slow');
          }
          timer = setTimeout(render, rm ? 250 : 40);
        }
        L.render = render;
        window.addEventListener('error', function (e) {
          if (L.isReady) return;
          var t = e.target;
          if (e instanceof ErrorEvent) L.error('init', e.message);
          else if (t && t.tagName === 'SCRIPT') L.error('init', 'Could not load ' + (t.src || 'script'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { if (!L.isReady) L.error('init', e.reason && e.reason.message ? e.reason.message : e.reason); });
      })();
    </script>
    <style>
      /* critical loader CSS (inline so it paints before the bundles load) */
      html { background: #f3f3f1; color: #161616; }
      html[data-theme='dark'] { background: #121212; color: #ededea; }
      html.mv-loading #viewport { visibility: hidden; }
      #loader { --ld-bg: #f3f3f1; --ld-ink: #161616; --ld-grey: #6b6b68; --ld-line: rgba(22, 22, 22, 0.14); --ld-err: #9b2c2c;
        position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: var(--ld-bg); color: var(--ld-ink);
        font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0.04em; transition: opacity 0.5s ease; }
      html[data-theme='dark'] #loader { --ld-bg: #121212; --ld-ink: #ededea; --ld-grey: #9a9a95; --ld-line: rgba(237, 237, 234, 0.16); --ld-err: #e08a8a; }
      html[data-lang='zh'] #loader { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', monospace; }
      #loader.is-done { opacity: 0; pointer-events: none; }
      #loader .ld-box { width: 360px; max-width: calc(100vw - 48px); }
      #loader .ld-title { font-size: 14px; letter-spacing: 0.14em; }
      #loader .ld-sub { color: var(--ld-grey); font-size: 12px; letter-spacing: 0.14em; margin-top: 4px; }
      #loader .ld-bar { position: relative; height: 2px; background: var(--ld-line); margin: 28px 0 18px; overflow: hidden; }
      #loader .ld-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ld-ink); transition: width 0.06s linear; }
      #loader .ld-bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 22%; left: -22%; background: linear-gradient(90deg, transparent, var(--ld-grey), transparent); opacity: 0.55; animation: ld-sweep 1.6s ease-in-out infinite; }
      @keyframes ld-sweep { to { left: 100%; } }
      #loader .ld-steps { list-style: none; margin: 0; padding: 0; color: var(--ld-grey); font-size: 12px; }
      #loader .ld-steps li { display: flex; align-items: center; gap: 10px; height: 22px; }
      #loader .ld-steps li::before { content: ''; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; box-sizing: border-box; flex: none; }
      #loader .ld-steps li.active { color: var(--ld-ink); }
      #loader .ld-steps li.active::before { border-color: var(--ld-ink); animation: ld-pulse 1s ease-in-out infinite alternate; }
      #loader .ld-steps li.done { color: var(--ld-ink); }
      #loader .ld-steps li.done::before { background: var(--ld-ink); border-color: var(--ld-ink); }
      @keyframes ld-pulse { from { opacity: 0.25; } to { opacity: 1; } }
      #loader button { font: inherit; letter-spacing: 0.08em; color: var(--ld-ink); background: none; border: 1px solid var(--ld-ink); padding: 7px 14px; cursor: pointer; }
      #loader .ld-slow { display: none; margin: 18px 0 0; color: var(--ld-grey); }
      #loader .ld-slow button { margin-left: 10px; padding: 3px 10px; }
      #loader.is-slow .ld-slow { display: block; }
      #loader .ld-error { display: none; }
      #loader.is-error .ld-progress { display: none; }
      #loader.is-error .ld-error { display: block; }
      #loader .ld-error h2 { font-size: 15px; font-weight: 600; letter-spacing: 0.06em; margin: 26px 0 10px; color: var(--ld-err); }
      #loader .ld-error p { margin: 0 0 12px; line-height: 1.6; letter-spacing: 0.02em; }
      #loader .ld-error code { display: block; color: var(--ld-grey); font-size: 11px; margin: 0 0 18px; word-break: break-word; }
      @media (prefers-reduced-motion: reduce) { #loader, #loader .ld-fill { transition: none; } #loader .ld-bar::after, #loader .ld-steps li.active::before { animation: none; } #loader .ld-bar::after { display: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="ld-box">
        <div class="ld-title" id="ld-title">MID VALLEY – ABDULLAH HUKUM</div>
        <div class="ld-sub" id="ld-sub">SITE ANALYSIS · LOADING</div>
        <div class="ld-progress">
          <div class="ld-bar" aria-hidden="true"><div class="ld-fill"></div></div>
          <ol class="ld-steps">
            <li data-step="app" class="active"><span>Application</span></li>
            <li data-step="data"><span>Map data (OpenStreetMap)</span></li>
            <li data-step="scene"><span>3D scene</span></li>
            <li data-step="fonts"><span>Fonts</span></li>
            <li data-step="frame"><span>First frame</span></li>
          </ol>
          <p class="ld-slow"><span id="ld-slow-text">This is taking longer than usual.</span><button type="button" id="ld-slow-reload">Reload</button></p>
        </div>
        <div class="ld-error" role="alert">
          <h2 id="ld-err-title"></h2>
          <p id="ld-err-text"></p>
          <code id="ld-err-detail"></code>
          <button type="button" id="ld-err-reload">Reload</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var S = window.__loader.strings, el = document.getElementById('loader');
        document.getElementById('ld-title').textContent = S.title; document.getElementById('ld-sub').textContent = S.sub;
        ['app', 'data', 'scene', 'fonts', 'frame'].forEach(function (k) { el.querySelector('[data-step="' + k + '"] span').textContent = S[k]; });
        document.getElementById('ld-slow-text').textContent = S.slow;
        ['ld-slow-reload', 'ld-err-reload'].forEach(function (id) { var b = document.getElementById(id); b.textContent = S.reload; b.onclick = function () { location.reload(); }; });
        window.__loader.render();
      })();
    </script>
    <div id="viewport">
      <div id="stage" aria-live="polite">
        <div id="gl"></div>
        <div class="scrim scrim-left"></div>
        <div class="scrim scrim-bottom"></div>
        <div class="scrim scrim-top"></div>
        <div id="pins" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <section id="text-panel" class="text-panel"></section>
        <aside id="side-panel" class="side-panel"></aside>
        <button id="tp-toggle" class="panel-tab left" type="button" aria-controls="text-panel" aria-expanded="true"><span class="chev" aria-hidden="true">‹</span></button>
        <button id="sp-toggle" class="panel-tab right" type="button" aria-controls="side-panel" aria-expanded="true"><span class="chev" aria-hidden="true">›</span></button>
        <!-- mobile only (html.mobile): bottom sheet above the chapter rail; main.ts moves the text panel and the side panel
             into #sheet-body on narrow / short screens and back on desktop. Collapsed it shows a peek (number + headline). -->
        <div id="sheet" class="sheet">
          <button id="sheet-handle" class="sheet-handle" type="button" aria-expanded="false" aria-controls="sheet-body" aria-label="Show chapter details"><span class="grip" aria-hidden="true"></span></button>
          <div id="sheet-body" class="sheet-body"></div>
        </div>

        <!-- page header: exactly two children, the mark (site title) and the tools (language + display buttons) -->
        <header id="top-buttons" class="top-bar">
          <div class="mark brand">
            <span class="mono" id="brand-name">MID VALLEY – ABDULLAH HUKUM</span>
            <span class="mono muted" id="brand-sub">SITE ANALYSIS · DEMO 0.3</span>
          </div>
          <div class="tools top-buttons" id="top-tools" role="toolbar" aria-label="Display controls">
            <div id="lang-switch" class="lang-switch" role="group" aria-label="Language"></div>
            <button id="btn-maponly" class="icon-btn" aria-pressed="false" aria-controls="text-panel side-panel" title="Map only (M)"><svg class="ico-svg" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="6" y="6" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.5"/></svg></button>
            <button id="btn-trains" class="icon-btn" aria-pressed="true" title="Trains on the LRT viaduct (illustrative)"><svg class="ico-svg" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="4.5" y="2.5" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 8.5h11" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="11.5" r="1" fill="currentColor"/><circle cx="12.5" cy="11.5" r="1" fill="currentColor"/><path d="M7 14.5l-2 3M13 14.5l2 3" stroke="currentColor" stroke-width="1.4"/></svg></button>
            <button id="btn-autoplay" class="icon-btn" aria-pressed="false" title="Autoplay chapters"><span class="ico">▶</span></button>
            <button id="btn-sound" class="icon-btn" aria-pressed="false" title="Sound (chapter chime)"><span class="ico">♪</span></button>
            <button id="btn-theme" class="icon-btn" aria-pressed="false" title="Dark / light"><span class="ico">◐</span></button>
            <button id="btn-fullscreen" class="icon-btn" title="Fullscreen (F)"><span class="ico">⤢</span></button>
            <!-- mobile only: less-used tools move into this overflow menu (see setMobile in main.ts) -->
            <button id="btn-more" class="icon-btn more-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu" title="More options"><span class="ico">⋯</span></button>
            <div id="more-menu" class="more-menu" role="group" aria-label="More options" hidden></div>
          </div>
        </header>

        <div class="map-furniture">
          <!-- shown only while the camera is away from the chapter's preset (see updateResetBtn in main.ts) -->
          <button id="btn-reset" class="text-btn mono is-hidden" type="button" tabindex="-1" aria-hidden="true" title="Reset camera to this chapter's view">RESET VIEW</button>
          <div class="compass" id="compass" title="North arrow follows the camera">
            <!-- dial: hairline ring; the whole rose (4 ticks, needle, N) turns with the camera bearing -->
            <svg id="north" viewBox="-30 -30 60 60" width="60" height="60" role="img" aria-label="North arrow">
              <circle r="27" class="ring" />
              <g id="north-needle">
                <path d="M0,-27V-23.2M27,0H23.2M0,27V23.2M-27,0H-23.2" class="ticks" />
                <path d="M0,-12.5L3.6,0H-3.6Z" class="needle-n" />
                <path d="M0,12.5L3.6,0H-3.6Z" class="needle-s" />
                <circle r="1.5" class="hub" />
                <text id="north-n" x="0" y="-17.6" text-anchor="middle" dominant-baseline="central" class="n">N</text>
              </g>
            </svg>
          </div>
        </div>

        <footer class="bottom-bar">
          <!-- chapter rail (after the Banqiao Station infographic): equal segments, each with a 1 px top rule; the current
               chapter's rule thickens to a 3 px ink bar, which fills with the autoplay progress while autoplay runs -->
          <nav class="rail" aria-label="Chapters">
            <div id="chapter-tabs" class="tabs"></div>
            <button class="arr" id="btn-prev" type="button" aria-label="Previous chapter">←</button>
            <button class="arr" id="btn-next" type="button" aria-label="Next chapter">→</button>
          </nav>
          <div class="credit mono"><span id="credit-prefix">Illustrative block massing</span></div>
        </footer>
      </div>
      <!-- bottom-right map strip (after Google Maps' bottom strip): map data credit + scale bar on one baseline, on a
           light translucent band; outside the scaled stage so it stays legible at any window size; positioned by fit() -->
      <div id="map-strip" class="map-strip">
        <a id="osm-credit" class="osm-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" aria-label="Map data © OpenStreetMap contributors: copyright and licence (opens in a new tab)">© OpenStreetMap contributors</a>
        <div class="scalebar mono" id="scalebar"><span id="scale-label">100 m</span><div id="scale-bar" class="bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
