<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23161616%22/%3E%3Crect x=%224%22 y=%223%22 width=%223%22 height=%2210%22 fill=%22%23f3f3f1%22/%3E%3Crect x=%229%22 y=%226%22 width=%223%22 height=%227%22 fill=%22%23f3f3f1%22/%3E%3C/svg%3E" />
    <title>Mid Valley – Abdullah Hukum Transit Hub · Site Analysis (demo)</title>
    <meta name="description" content="Illustrative 3D site analysis of the Mid Valley – Abdullah Hukum transit hub, Kuala Lumpur, built from OpenStreetMap data." />
  </head>
  <body>
    <div id="viewport">
      <div id="stage" aria-live="polite">
        <div id="gl"></div>
        <div class="scrim scrim-left"></div>
        <div class="scrim scrim-bottom"></div>
        <div class="scrim scrim-top"></div>
        <div id="pins" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <header class="brand">
          <span class="mono" id="brand-name">MID VALLEY – ABDULLAH HUKUM</span>
          <span class="mono muted" id="brand-sub">SITE ANALYSIS · DEMO 0.3</span>
        </header>

        <section id="text-panel" class="text-panel"></section>
        <aside id="side-panel" class="side-panel"></aside>
        <button id="tp-toggle" class="panel-tab left" type="button" aria-controls="text-panel" aria-expanded="true"><span class="chev" aria-hidden="true">‹</span></button>
        <button id="sp-toggle" class="panel-tab right" type="button" aria-controls="side-panel" aria-expanded="true"><span class="chev" aria-hidden="true">›</span></button>

        <div class="top-buttons" id="top-buttons" role="toolbar" aria-label="Display controls">
          <div id="lang-switch" class="lang-switch" role="group" aria-label="Language"></div>
          <button id="btn-maponly" class="icon-btn" aria-pressed="false" aria-controls="text-panel side-panel" title="Map only (M)"><svg class="ico-svg" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="6" y="6" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.5"/></svg></button>
          <button id="btn-trains" class="icon-btn" aria-pressed="true" title="Trains on the LRT viaduct (illustrative)"><svg class="ico-svg" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="4.5" y="2.5" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 8.5h11" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="11.5" r="1" fill="currentColor"/><circle cx="12.5" cy="11.5" r="1" fill="currentColor"/><path d="M7 14.5l-2 3M13 14.5l2 3" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button id="btn-autoplay" class="icon-btn" aria-pressed="false" title="Autoplay chapters"><span class="ico">▶</span></button>
          <button id="btn-sound" class="icon-btn" aria-pressed="false" title="Sound (chapter chime)"><span class="ico">♪</span></button>
          <button id="btn-theme" class="icon-btn" aria-pressed="false" title="Dark / light"><span class="ico">◐</span></button>
          <button id="btn-fullscreen" class="icon-btn" title="Fullscreen (F)"><span class="ico">⤢</span></button>
        </div>

        <div class="map-furniture">
          <div class="compass" id="compass" title="North arrow follows the camera">
            <svg id="north" viewBox="-30 -30 60 60" width="60" height="60" aria-label="North arrow">
              <circle r="27" class="ring" />
              <g id="north-needle">
                <path d="M0,-22 L6,4 L0,0 L-6,4 Z" class="needle" />
                <text id="north-n" y="-8" x="0" text-anchor="middle" class="n">N</text>
              </g>
            </svg>
          </div>
          <div class="scalebar mono"><div id="scale-bar" class="bar"></div><span id="scale-label">100 m</span></div>
          <button id="btn-reset" class="text-btn mono" title="Reset camera to this chapter's view">RESET VIEW</button>
        </div>

        <footer class="bottom-bar">
          <nav id="chapter-tabs" class="tabs" aria-label="Chapters"></nav>
          <div class="progress"><div id="progress-fill"></div><div id="autoplay-fill"></div></div>
          <div class="credit mono"><span id="credit-prefix">Illustrative block massing · Map data ©</span> <a id="credit-link" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
